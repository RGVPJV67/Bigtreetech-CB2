## Section to setup stepper motors, endstops and stepper motor drivers.

[stepper_x]
##	Connected to X-MOT (B Motor)
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: !EBBCan:PB6
position_min: -6.5 #9
##--------------------------------------------------------------------
position_endstop: -6.5 #9
position_max: 245
##--------------------------------------------------------------------
homing_speed: 100   #Max 100
homing_retract_dist: 5
#homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE7
interpolate: True
run_current: 0.8
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
##	Connected to Y-MOT (A Motor)
step_pin: PD8
dir_pin: !PB12
enable_pin: !PD9
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: ^!PA2
position_min: -17
##--------------------------------------------------------------------
position_endstop: 259 #275
position_max: 259 #275
##--------------------------------------------------------------------
homing_speed: 100  #Max 100
homing_retract_dist: 5
#homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE15
interpolate: True
run_current: 0.8 #1 #1.5
hold_current: 0.6 #0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## In E3-MOT Position
## Z0 Stepper - Z Left Motor
[stepper_z]
step_pin: PD12
dir_pin: PC4
enable_pin: !PE8
rotation_distance: 8
full_steps_per_rotation: 200
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 232

##--------------------------------------------------------------------
position_min: -10
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 5

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z]
uart_pin: PA15
uart_address: 0
interpolate: True
run_current: 0.65 #0.8
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##	In E2-MOT Position
##	Z1 Stepper - Z Rear Motor
[stepper_z1]
step_pin: PE2
dir_pin: PE4
enable_pin: !PE3
rotation_distance: 8
full_steps_per_rotation: 200
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: True
run_current: 0.65 #0.8
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##	In E1-MOT Position
##	Z2 Stepper - Z Right Motor
[stepper_z2]
step_pin: PE6
dir_pin: PC13
enable_pin: !PE5
rotation_distance: 8
full_steps_per_rotation: 200
microsteps: 16

##	Make sure to update below for your relevant driver (2208 or 2209)
[tmc2209 stepper_z2]
uart_pin: PC15
interpolate: true
run_current: 0.65 #0.8
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0


